name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PAYMENT_MODE=${{ vars.NEXT_PUBLIC_PAYMENT_MODE || 'manual' }}

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate production configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          AUTH_URL: ${{ vars.AUTH_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          CADDY_COMPOSE_PATH: ${{ secrets.CADDY_COMPOSE_PATH }}
        run: |
          set -eu
          for name in \
            DATABASE_URL SUPABASE_SECRET_KEY AUTH_SECRET \
            AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_APP_URL \
            AUTH_URL APP_DOMAIN CADDY_COMPOSE_PATH
          do
            eval "value=\${$name:-}"
            test -n "$value" || { echo "Missing production value: $name"; exit 1; }
          done

      - name: Deploy with Docker over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_SIGNATURE_SECRET_KEY: ${{ secrets.MIDTRANS_SIGNATURE_SECRET_KEY }}
          MIDTRANS_IS_PRODUCTION: ${{ vars.MIDTRANS_IS_PRODUCTION }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          AUTH_URL: ${{ vars.AUTH_URL }}
          AUTH_TRUST_HOST: ${{ vars.AUTH_TRUST_HOST }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          CADDY_COMPOSE_PATH: ${{ secrets.CADDY_COMPOSE_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_REPOSITORY,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,DATABASE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,SUPABASE_SECRET_KEY,MIDTRANS_SERVER_KEY,MIDTRANS_SIGNATURE_SECRET_KEY,MIDTRANS_IS_PRODUCTION,AUTH_SECRET,AUTH_GOOGLE_ID,AUTH_GOOGLE_SECRET,NEXT_PUBLIC_APP_URL,AUTH_URL,AUTH_TRUST_HOST,APP_DOMAIN,CADDY_COMPOSE_PATH
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/fixasn-lms"
            NETWORK=fixasn-net
            APP_NAME=fixasn-app
            CADDY_NAME=caddy
            IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Shared network for Caddy (compose) + app (docker run).
            docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"

            # Write Caddyfile into the compose file's directory so the
            # bind-mount ./Caddyfile in the compose file resolves correctly.
            # Includes a www → apex permanent redirect.
            COMPOSE_DIR=$(dirname "$CADDY_COMPOSE_PATH")
            {
              printf '%s\n' \
                "$APP_DOMAIN {" \
                "    encode zstd gzip" \
                "    reverse_proxy $APP_NAME:3000" \
                "}"
              printf '\n'
              printf 'www.%s {\n' "$APP_DOMAIN"
              printf '    redir https://%s{uri} 301\n' "$APP_DOMAIN"
              printf '}\n'
            } > "$COMPOSE_DIR/Caddyfile"

            # Start (or ensure) Caddy via the compose file placed on the VPS.
            docker compose -f "$CADDY_COMPOSE_PATH" up -d

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE"

            # Apply committed migrations before replacing the running app.
            # Runs as root: the prisma CLI writes engine binaries into
            # /app/node_modules/@prisma/engines (root-owned in the image);
            # the runtime app container still runs as the nextjs user.
            docker run --rm \
              --user root \
              --network "$NETWORK" \
              --env DATABASE_URL="$DATABASE_URL" \
              "$IMAGE" npx prisma migrate deploy

            # Replace the app container directly (brief downtime during restart).
            docker rm -f "$APP_NAME" >/dev/null 2>&1 || true
            docker run -d \
              --name "$APP_NAME" \
              --network "$NETWORK" \
              --network-alias "$APP_NAME" \
              --restart unless-stopped \
              --expose 3000 \
              --env NODE_ENV=production \
              --env DATABASE_URL="$DATABASE_URL" \
              --env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              --env SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
              --env MIDTRANS_SERVER_KEY="${MIDTRANS_SERVER_KEY:-}" \
              --env MIDTRANS_SIGNATURE_SECRET_KEY="${MIDTRANS_SIGNATURE_SECRET_KEY:-}" \
              --env MIDTRANS_IS_PRODUCTION="${MIDTRANS_IS_PRODUCTION:-false}" \
              --env AUTH_SECRET="$AUTH_SECRET" \
              --env AUTH_GOOGLE_ID="$AUTH_GOOGLE_ID" \
              --env AUTH_GOOGLE_SECRET="$AUTH_GOOGLE_SECRET" \
              --env NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
              --env AUTH_URL="$AUTH_URL" \
              --env AUTH_TRUST_HOST="${AUTH_TRUST_HOST:-true}" \
              "$IMAGE"

            # Give the server a moment to start listening, then reload Caddy
            # so it proxies the freshly recreated app container.
            sleep 3
            docker exec "$CADDY_NAME" caddy reload \
              --config /etc/caddy/Caddyfile --adapter caddyfile

            docker image prune -af --filter "until=168h"
            docker logout ghcr.io >/dev/null 2>&1 || true
